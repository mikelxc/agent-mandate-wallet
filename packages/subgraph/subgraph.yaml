specVersion: 1.3.0
description: Wayleave registered NFAT token activity and EntryPoint outcomes on Sepolia
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: Registry
    network: sepolia
    source:
      address: "0xf0C862D40eE1E9637a6B8634E75ebc86aeCCa3dE"
      abi: Registry
      startBlock: 11658202
    context:
      chainId:
        type: String
        data: "11155111"
      token:
        type: Bytes
        data: "0x3c14067e0dbd276c083908c1d9d2f2dc0a65ca41"
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities: [Account, PaymentTransfer, UserOperation]
      abis:
        - name: Registry
          file: ./abis/Registry.json
      eventHandlers:
        - event: AccountCreated(indexed uint256,indexed address,indexed address,string,bytes32)
          handler: handleAccountCreated
      file: ./src/mapping.ts
  - kind: ethereum/contract
    name: Token
    network: sepolia
    source:
      address: "0x3C14067e0dbD276c083908C1D9D2f2Dc0A65ca41"
      abi: Token
      startBlock: 11658202
    context:
      chainId:
        type: String
        data: "11155111"
      token:
        type: Bytes
        data: "0x3c14067e0dbd276c083908c1d9d2f2dc0a65ca41"
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities: [Account, PaymentTransfer, UserOperation]
      abis:
        - name: Token
          file: ./abis/Token.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: ./src/mapping.ts
  - kind: ethereum/contract
    name: EntryPoint
    network: sepolia
    source:
      address: "0x433709009B8330FDa32311DF1C2AFA402eD8D009"
      abi: EntryPoint
      startBlock: 11658202
    context:
      chainId:
        type: String
        data: "11155111"
      token:
        type: Bytes
        data: "0x3c14067e0dbd276c083908c1d9d2f2dc0a65ca41"
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities: [Account, PaymentTransfer, UserOperation]
      abis:
        - name: EntryPoint
          file: ./abis/EntryPoint.json
      eventHandlers:
        - event: UserOperationEvent(indexed bytes32,indexed address,indexed address,uint256,bool,uint256,uint256)
          handler: handleUserOperation
          receipt: true
      file: ./src/mapping.ts
