[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.33"
evm_version = "prague"
via_ir = true
ignored_error_codes = [2424, 8429, 4591]
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/", "forge-std/=lib/forge-std/src/", "kernel-v4/=lib/kernel-v4/src/", "account-abstraction/=lib/account-abstraction/contracts/", "solady/=node_modules/solady/src/"]

[profile.default.fuzz]
runs = 256
