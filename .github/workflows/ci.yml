name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Generated ABIs are current
        run: git diff --exit-code -- packages/sdk/src/generated
      - name: Local integration
        run: |
          anvil --silent &
          bun run smoke
